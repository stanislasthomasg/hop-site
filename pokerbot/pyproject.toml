[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pokerbot"
version = "0.1.0"
description = "No-Limit Hold'em bots that learn by self-play (simulation only)"
requires-python = ">=3.10"
dependencies = ["eval7>=0.1.10", "numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8"]
fast = ["numba>=0.59"]

[project.scripts]
pokerbot = "pokerbot.cli:main"

[tool.setuptools.packages.find]
include = ["pokerbot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
